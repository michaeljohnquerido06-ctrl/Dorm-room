<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Sign Up</title>
</head>

<body class="relative min-h-screen">

    <img
        src="image/flat-student-dormitory-room-or-hostel-university-or-college-dorm-bedroom-empty-interior-with-bunk-bed-desk-at-window-chair-and-bookshelf-living-apartment-or-accommodation-with-.jpg"
        alt="background"
        class="fixed inset-0 w-full h-full object-cover"
    >

    <main class="relative flex items-center justify-center min-h-screen p-4">

        <div class="bg-[#0169A9]/70 w-full max-w-[500px] flex flex-col items-center gap-4 p-6 sm:p-8 rounded-xl">

            <div class="flex items-center gap-2">
                <img
                    src="image/house-with-heart.png"
                    alt="logo"
                    class="w-12 h-12 sm:w-16 sm:h-16"
                >

                <h1 class="text-white font-bold text-xl sm:text-2xl">
                    Admin Panel
                </h1>
            </div>

            <h1 class="text-xl sm:text-2xl font-bold text-white">
                Sign Up
            </h1>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full">

                <div class="flex flex-col">
                    <label for="fullName" class="text-white font-bold">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Full Name"
                        class="p-2 rounded-lg w-full"
                    >
                </div>

                <div class="flex flex-col">
                    <label for="hrId" class="text-white font-bold">
                        HR ID
                    </label>

                    <input
                        type="text"
                        id="hrId"
                        placeholder="ID provided by HR"
                        class="p-2 rounded-lg w-full"
                    >
                </div>

                <div class="flex flex-col">
                    <label for="email" class="text-white font-bold">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email"
                        class="p-2 rounded-lg w-full"
                    >
                </div>

                <div class="flex flex-col">
                    <label for="accountRole" class="text-white font-bold">
                        Account Role
                    </label>

                    <select
                        id="accountRole"
                        class="p-2 rounded-lg w-full"
                    >
                        <option value="">Select Role</option>
                        <option value="Administrator">Administrator</option>
                        <option value="Staff">Staff</option>
                        <option value="Manager">Manager</option>
                    </select>
                </div>

                <div class="flex flex-col">
                    <label for="password" class="text-white font-bold">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        class="p-2 rounded-lg w-full"
                    >
                </div>

                <div class="flex flex-col">
                    <label for="confirmPassword" class="text-white font-bold">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm Password"
                        class="p-2 rounded-lg w-full"
                    >
                </div>

            </div>

            <button
                id="loginButton"
                class="w-full sm:w-auto bg-[#1756a3] text-white font-bold py-2 px-8 rounded-lg hover:bg-[#00385A] transition"
            >
                Sign Up
            </button>

        </div>

    </main>

    <script src="Javascript/login.js"></script>
</body>

</html>
