<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login</title>
</head>
<body class="relative min-h-screen">

        <img
        src="image/flat-student-dormitory-room-or-hostel-university-or-college-dorm-bedroom-empty-interior-with-bunk-bed-desk-at-window-chair-and-bookshelf-living-apartment-or-accommodation-with-.jpg"
        alt="background"
        class="absolute inset-0 w-full h-full object-cover"
    >

    <main class="relative flex items-center justify-center min-h-screen">

        <div class="bg-[#0169A9]/70 w-[400px] h-[600px] p-[30px] flex flex-col items-center justify-center gap-4">

            <div class="flex flex-col items-center gap-2">
                <img src="image/786528834_899968536212774_3016178300078205562_n.jpg" alt="logo" class="w-[100px] h-[100px] justify-center">
                <h1 class="text-white font-bold text-2xl pr-4">Admin Panel</h1>
            </div>

                <h1 class=" text-2xl font-bold text-white flex justify-center">Log in</h1>

            <div class="flex flex-col">
                <p class="text-white 
                    text-2x1 
                    font-bold">
                    Email:
                </p>
                <input type="Email" 
                        id="email" 
                        placeholder="Email">
            </div>

             <div class="flex flex-col">
                <p class="text-white 
                    text-2x1 
                    font-bold">
                    Password:
                </p>
                <input type="Password" 
                        id="password" 
                        placeholder="Password">
            </div>

            <button
                id="loginButton"
                 class="w-[150px] bg-[#1756a3] text-white font-bold py-2 px-8 rounded-lg hover:bg-[#00385A] transition"
            >
                Log In
            </button>

            <button onclick="window.location.href='signup.html'" class="w-[150px] bg-[#1756a3] text-white font-bold py-2 px-8 rounded-lg hover:bg-[#00385A] transition">
                Sign up
            </button>

            

        </div>
    </main>

    <script src="Javascript/login.js"></script>
</body>
</html>
