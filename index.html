<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <title>Home</title>
</head>

<body class="h-screen overflow-hidden flex flex-col">

    <header class="bg-[#0169A9] flex items-center justify-between p-2">

        <button
            id="menuButton"
            class="lg:hidden p-2 rounded-lg hover:bg-[#00385A]"
        >
            <img
                src="image/menu-bar.png"
                alt="Menu"
                class="w-8 h-8"
            >
        </button>

        <div class="flex items-center">
            <a href="index.html" class="flex items-center">
                <img
                    src="image/house-with-heart.png"
                    alt="Logo"
                    class="w-10 h-10"
                >

                <h1 class="text-white text-2xl font-bold p-3">
                    Admin Panel
                </h1>
            </a>
        </div>

        <a href="settings.html" class="inline-block p-2 rounded-lg transition hover:bg-[#00385A]">
            <img 
                src="image/setting-removebg-preview.png" 
                alt="Settings" 
                class="w-8 h-8 transition hover:brightness-0 hover:invert"
            >
        </a>
        
    </header>

    <div class="flex flex-1 min-h-0">
        <aside
            id="sidebar"
            class="hidden lg:block fixed lg:static left-0 top-0 z-50 w-64 h-full lg:h-auto bg-[#004A77] shadow-md p-3"
        >
             <div class="mt-4">

                <button 
                    id="closeButton" 
                    class="lg:hidden absolute top-4 right-4 p-2 rounded-lg hover:bg-[#00385A]"
                >
                    <span class="text-white text-2xl">✕</span>
                </button>

                <h1 class="text-white text-2xl font-bold pr-12">
                    Admin management
                </h1>

                <br>
                <br>

                <p class="text-[#57ADD4]">
                    Management
                </p>

            </div>
            
            <div class="mt-4">
                <a href="index.html" class="flex items-center gap-3 px-6 rounded-lg bg-[#0989D9]">
                <img src="image/home.png" alt="home" class="w-8 h-8">
                <span class="text-white">Home</span>
            </a>

            <br>
            <a href="Residents.html" class="flex items-center gap-3 px-6 rounded-lg bg-[#01426A]">
                <img src="image/multiple-users-silhouette.png" alt="home" class="w-8 h-8">
                <span class="text-white">Residents</span>
            </a>

            <br>
            <a href="Queue.html" class="flex items-center gap-3 px-6 rounded-lg bg-[#01426A]">
                <img src="image/queue.png" alt="home" class="w-8 h-8">
                <span class="text-white">Queue</span>
            </a>

            <br>
            <a href="Rooms.html" class="flex items-center gap-3 px-6 rounded-lg bg-[#01426A]">
                <img src="image/round.png" alt="home" class="w-8 h-8">
                <span class="text-white">Rooms</span>
            </a>
            </div>

            <div class="mt-32">
                <a href="profile.html" class="flex items-center gap-3 px-6 rounded-lg bg-[#01426A] h-[50px]">

                    <img src="image/man-empty-avatar-photo-placeholder-for-social-networks-resumes-forums-and-dating-sites-male-and-female-no-photo-images-for-unfilled-user-profile-free-vector.jpg" 
                        alt="Profile" 
                        class="w-8 h-8 
                        rounded-full">
                    <span class="text-white">Profile</span>
                 </a>
            </div>

        </aside>

        <main class="flex-1 min-w-0 bg-gray-100 p-4 sm:p-6 lg:p-8 overflow-y-auto">

            <h2 class="text-3xl font-bold text-gray-800">
                Dashboard
            </h2>

            <p class="text-gray-500 mt-2">
                Overview
            </p>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mt-8">

                <div class="bg-white rounded-xl shadow p-6">

                    <p class="text-gray-500 whitespace-nowrap">
                        Available Rooms
                    </p>

                    <h3 id="availableRooms"
                        class="text-4xl font-bold text-[#0169A9] mt-2">
                        0
                    </h3>

                    <p id="roomsStatus"
                    class="text-sm text-gray-400 mt-2 whitespace-nowrap">
                        No data available
                    </p>

                </div>

                <div class="bg-white rounded-xl shadow p-6">

                    <p class="text-gray-500">
                        Residents
                    </p>

                    <h3 id="residentCount"
                        class="text-4xl font-bold text-[#0169A9] mt-2">
                        0
                    </h3>

                    <p id="residentStatus"
                    class="text-sm text-gray-400 mt-2 whitespace-nowrap">
                        No data available
                    </p>

                </div>

            </div>

            <div class="bg-white rounded-xl shadow p-6 mt-8">

                <h3 class="text-xl font-bold text-gray-800">
                    Analytics
                </h3>

                <div id="analytics"
                    class="h-64 flex items-center justify-center">

                    <p class="text-gray-400">
                        No data available
                    </p>

                </div>

            </div>

        </main>

    </div>

    

    <script src="Javascript/menu.js">
        if (localStorage.getItem("loggedIn") !== "true") {
                window.location.href = "Login.html";
            }
    </script>
</body>
</html>
